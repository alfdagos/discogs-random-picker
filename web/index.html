<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Pesca un disco a caso dalla tua collezione Discogs, tieni traccia degli ascolti e guarda le statistiche." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Discogs Random Picker</title>
  </head>
  <body>
    <header class="topbar">
      <img src="./icon.svg" alt="" width="28" height="28" />
      <h1>Random Picker</h1>
      <span id="user-badge" class="badge" hidden></span>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Sezioni">
      <button data-tab="pick" aria-label="Pesca"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg><span>Pesca</span></button>
      <button data-tab="history" aria-label="Storico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Storico</span></button>
      <button data-tab="stats" aria-label="Statistiche"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
      <button data-tab="settings" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Opzioni</span></button>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
